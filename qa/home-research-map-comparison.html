<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页研究地图视觉对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eef1f4; color: #101828; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      figure { margin: 0; background: #fff; border: 1px solid #d8dee7; }
      figcaption { border-bottom: 1px solid #d8dee7; font-size: 12px; font-weight: 700; padding: 8px 10px; }
      img { display: block; height: auto; width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>参考：Anthropic Path to Hope</figcaption>
        <img src="./path-to-hope-reference.png" alt="Anthropic Path to Hope 交互地图参考" />
      </figure>
      <figure>
        <figcaption>实现：EcoMOF-AI 首页研究地图</figcaption>
        <img src="./home-research-map-desktop-final.png" alt="EcoMOF-AI 首页研究地图实现" />
      </figure>
    </main>
  </body>
</html>
